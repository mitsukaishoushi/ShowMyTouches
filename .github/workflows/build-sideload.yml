name: Build ShowMyTouches for sideloading
on:
  push:
    paths:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install make ldid
      - name: Install Theos
        run: git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
      - name: Embed settings resources for single-file injection
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, plistlib
          root = pathlib.Path("SMTPrefs/layout/Library/Application Support/SMTPrefs.bundle")
          files = {str(p.relative_to(root)): p.read_bytes() for p in sorted(root.rglob("*")) if p.is_file()}
          data = plistlib.dumps(files, fmt=plistlib.FMT_BINARY)
          encoded = base64.b64encode(data).decode()
          key = "ShowMyTouches-" + hashlib.sha256(data).hexdigest()[:16]
          header = '#define SMT_EMBEDDED_BUNDLE "' + encoded + '"\n#define SMT_EMBEDDED_BUNDLE_ID "' + key + '"\n'
          pathlib.Path("SMTPrefs/Categories/NSBundle+SMTPrefs/SMTEmbeddedBundle.h").write_text(header)
          print("Embedded", len(files), "resource files")
          PY
      - name: Build standalone sideloading library
        run: |
          export THEOS="$HOME/theos"
          gmake clean all SIDELOADING=1 ARCHS=arm64 TARGET=iphone:clang:latest:14.0 LOGOS_DEFAULT_GENERATOR=internal
      - name: Collect library and settings resources
        run: |
          mkdir -p output
          LIBRARY="$(find .theos -name ShowMyTouches.dylib -type f | head -n 1)"
          test -n "$LIBRARY"
          cp "$LIBRARY" output/ShowMyTouches.dylib
          cp -R "SMTPrefs/layout/Library/Application Support/SMTPrefs.bundle" output/
          otool -L output/ShowMyTouches.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: ShowMyTouches-Sideload
          path: output/
          if-no-files-found: error
